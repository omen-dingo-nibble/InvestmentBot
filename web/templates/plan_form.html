{% extends "base.html" %}
{% block title %}{{ 'プラン編集' if plan else '新プラン作成' }}{% endblock %}
{% block content %}

<div class="page-header">
    <h4><i class="bi bi-bar-chart-line me-2 text-green"></i>
        {{ 'Edit: ' + plan.name if plan else '新プラン作成' }}
    </h4>
    <a href="{{ url_for('main.plans') }}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>戻る
    </a>
</div>

<div class="card" style="max-width:700px;">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label" style="color:var(--gyo-muted);font-size:.8rem;">プラン名 Plan Name <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required maxlength="64"
                           value="{{ plan.name if plan else '' }}"
                           placeholder="e.g. KKKPH Gold">
                </div>
                <div class="col-md-4">
                    <label class="form-label" style="color:var(--gyo-muted);font-size:.8rem;">状態 Status</label>
                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" name="is_active" id="is_active"
                               {{ 'checked' if (not plan or plan.is_active) else '' }}>
                        <label class="form-check-label" for="is_active" style="font-size:.875rem;">有効 Active</label>
                    </div>
                </div>
                <div class="col-12">
                    <label class="form-label" style="color:var(--gyo-muted);font-size:.8rem;">説明 Description</label>
                    <textarea name="description" class="form-control" rows="2"
                              placeholder="プランの説明…">{{ plan.description if plan else '' }}</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label" style="color:var(--gyo-muted);font-size:.8rem;">最低投資額 Min (₱) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text">₱</span>
                        <input type="number" step="1" min="1" name="min_amount" class="form-control" required
                               value="{{ plan.min_amount if plan else '' }}">
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" style="color:var(--gyo-muted);font-size:.8rem;">最高投資額 Max (₱) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text">₱</span>
                        <input type="number" step="1" min="1" name="max_amount" class="form-control" required
                               value="{{ plan.max_amount if plan else '' }}">
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" style="color:var(--gyo-muted);font-size:.8rem;">日利 Daily ROI (%) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="number" step="0.01" min="0" max="100" name="daily_roi" class="form-control" required
                               value="{{ plan.daily_roi_percent if plan else '' }}">
                        <span class="input-group-text">% / day</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" style="color:var(--gyo-muted);font-size:.8rem;">期間 Duration (days) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="number" step="1" min="1" max="3650" name="duration" class="form-control" required
                               value="{{ plan.duration_days if plan else '' }}">
                        <span class="input-group-text">日</span>
                    </div>
                </div>
                <div class="col-12">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="capital_return" id="cap_ret"
                               {{ 'checked' if (not plan or plan.capital_return) else '' }}>
                        <label class="form-check-label" for="cap_ret" style="font-size:.875rem;">
                            満期時に元本返還 Return principal at end of term
                        </label>
                    </div>
                </div>
            </div>

            <!-- Preview -->
            <div class="card mt-4" style="background:var(--gyo-surface);" id="preview-card">
                <div class="card-body">
                    <h6 class="text-green mb-3"><i class="bi bi-calculator me-2"></i>収益プレビュー Return Preview</h6>
                    <div id="preview-text" style="color:var(--gyo-muted);font-size:.85rem;">
                        数値を入力するとプレビューが表示されます
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-gold px-4">
                    <i class="bi bi-check-lg me-2"></i>{{ '保存 Save' if plan else '作成 Create' }}
                </button>
                <a href="{{ url_for('main.plans') }}" class="btn btn-outline-secondary">キャンセル</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function updatePreview() {
    const roi = parseFloat(document.querySelector('[name=daily_roi]').value) || 0;
    const dur = parseInt(document.querySelector('[name=duration]').value) || 0;
    const minAmt = parseFloat(document.querySelector('[name=min_amount]').value) || 0;
    const capRet = document.querySelector('[name=capital_return]').checked;
    if (!roi || !dur || !minAmt) return;
    const daily = minAmt * roi / 100;
    const earnings = daily * dur;
    const total = earnings + (capRet ? minAmt : 0);
    const roiTotal = ((earnings / minAmt) * 100).toFixed(1);
    const fmt = n => '₱' + n.toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});
    document.getElementById('preview-text').innerHTML =
        `<strong style="color:var(--gyo-text);">₱${minAmt.toLocaleString()}</strong> 投資の場合:<br>` +
        `毎日: <strong style="color:var(--gyo-green);">${fmt(daily)}</strong><br>` +
        `${dur}日間の合計利益: <strong style="color:var(--gyo-green);">${fmt(earnings)}</strong><br>` +
        `総受取額: <strong style="color:var(--gyo-light);">${fmt(total)}</strong> (${roiTotal}% total return)`;
}
document.querySelectorAll('[name=daily_roi],[name=duration],[name=min_amount],[name=capital_return]')
    .forEach(el => el.addEventListener('input', updatePreview));
updatePreview();
</script>
{% endblock %}
