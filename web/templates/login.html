<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | High Caliber NW Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --hcc-gold: #B8860B;
            --hcc-gold-light: #D4A017;
            --hcc-dark: #0D1117;
            --hcc-surface: #161B22;
            --hcc-border: #2D3748;
        }

        body {
            min-height: 100vh;
            background: var(--hcc-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .login-wrap {
            width: 100%;
            max-width: 420px;
            padding: 1rem;
        }

        .login-card {
            background: var(--hcc-surface);
            border: 1px solid var(--hcc-border);
            border-radius: 16px;
            padding: 2.5rem;
        }

        .brand-block {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #B8860B, #7a5a08);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; color: #fff; font-weight: 900;
            margin: 0 auto .75rem;
        }

        .brand-block h4 {
            color: #E2E8F0;
            font-weight: 700;
            margin-bottom: .15rem;
        }

        .brand-block small {
            color: #718096;
            font-size: .8rem;
        }

        .form-control {
            background: #0D1117;
            border-color: var(--hcc-border);
            color: #E2E8F0;
            border-radius: 8px;
        }

        .form-control:focus {
            background: #0D1117;
            border-color: var(--hcc-gold);
            color: #E2E8F0;
            box-shadow: 0 0 0 .2rem rgba(184,134,11,.25);
        }

        .form-label { color: #A0AEC0; font-size: .875rem; font-weight: 500; }

        .input-group-text {
            background: #111418;
            border-color: var(--hcc-border);
            color: #718096;
        }

        .btn-sign-in {
            background: linear-gradient(135deg, #B8860B, #7a5a08);
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 10px;
            padding: .75rem;
            transition: opacity .2s;
        }

        .btn-sign-in:hover { opacity: .9; color: #fff; }

        .site-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: .8rem;
            color: #4A5568;
        }

        .site-link a { color: var(--hcc-gold-light); text-decoration: none; }
        .site-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="brand-block">
                <div class="brand-logo">HC</div>
                <h4>High Caliber NW</h4>
                <small>Investment Admin Portal</small>
            </div>

            {% if error %}
            <div class="alert alert-danger py-2 mb-3" style="font-size:.875rem;">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ error }}
            </div>
            {% endif %}

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2 mb-3" style="font-size:.875rem;">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username"
                               name="username" required autofocus placeholder="admin">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password"
                               name="password" required placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="btn btn-sign-in w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>
        </div>

        <div class="site-link">
            <a href="https://www.highcalibernorthwest.com" target="_blank">
                <i class="bi bi-globe2 me-1"></i>highcalibernorthwest.com
            </a>
        </div>
    </div>
</body>
</html>
