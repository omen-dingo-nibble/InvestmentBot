<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | 玉露 Gyokuro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --gyo-ink:     #0a0f0d;
            --gyo-washi:   #111a14;
            --gyo-card:    #1c2a1f;
            --gyo-border:  #253b2c;
            --gyo-matcha:  #2d6a4f;
            --gyo-green:   #52b788;
            --gyo-light:   #74c69d;
            --gyo-text:    #e8f5ec;
            --gyo-muted:   #6b8f74;
            --gyo-gold:    #d4a853;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: var(--gyo-ink);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 1rem;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(45,106,79,.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(82,183,136,.06) 0%, transparent 50%);
        }

        .login-wrap { width: 100%; max-width: 400px; }

        /* Japanese decorative header */
        .jp-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-mark {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, var(--gyo-matcha), var(--gyo-green));
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 0 30px rgba(82,183,136,.25), 0 0 60px rgba(82,183,136,.08);
        }

        .logo-mark .jp-char {
            font-size: 1.6rem; color: #fff; font-weight: 800;
            line-height: 1; letter-spacing: -1px;
        }

        .jp-header h1 {
            font-size: 1.5rem; font-weight: 800;
            color: var(--gyo-text); margin-bottom: .3rem;
        }

        .jp-header .jp-sub {
            font-size: .8rem; color: var(--gyo-muted);
            letter-spacing: 2px;
        }

        /* Decorative Japanese border pattern */
        .jp-header .jp-pattern {
            display: flex; align-items: center; gap: 8px;
            justify-content: center; margin-top: .6rem;
        }

        .jp-header .jp-pattern span {
            font-size: .7rem; color: var(--gyo-muted); letter-spacing: 4px;
        }

        .jp-header .jp-pattern::before,
        .jp-header .jp-pattern::after {
            content: '';
            flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gyo-border), transparent);
        }

        .login-card {
            background: var(--gyo-card);
            border: 1px solid var(--gyo-border);
            border-radius: 20px;
            padding: 2rem 1.75rem;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }

        .form-label {
            color: var(--gyo-muted);
            font-size: .8rem;
            font-weight: 600;
            letter-spacing: .3px;
            margin-bottom: .4rem;
        }

        .input-group-text {
            background: rgba(255,255,255,.04);
            border-color: var(--gyo-border);
            color: var(--gyo-muted);
        }

        .form-control {
            background: rgba(255,255,255,.04);
            border-color: var(--gyo-border);
            color: var(--gyo-text);
            border-radius: 0 8px 8px 0 !important;
        }

        .form-control:first-child {
            border-radius: 8px 0 0 8px !important;
        }

        .form-control:focus {
            background: rgba(255,255,255,.06);
            border-color: var(--gyo-green);
            color: var(--gyo-text);
            box-shadow: 0 0 0 .2rem rgba(82,183,136,.18);
        }

        .form-control::placeholder { color: #3a5040; }

        .btn-signin {
            width: 100%;
            background: linear-gradient(135deg, var(--gyo-matcha), var(--gyo-green));
            border: none; color: #fff;
            font-weight: 700; font-size: .95rem;
            padding: .75rem;
            border-radius: 12px;
            transition: all .2s;
            box-shadow: 0 4px 16px rgba(82,183,136,.25);
        }

        .btn-signin:hover {
            background: linear-gradient(135deg, var(--gyo-green), #74c69d);
            color: #fff;
            box-shadow: 0 6px 20px rgba(82,183,136,.35);
            transform: translateY(-1px);
        }

        .error-box {
            background: rgba(220,53,69,.1);
            border: 1px solid rgba(220,53,69,.25);
            border-radius: 10px;
            padding: .65rem 1rem;
            font-size: .85rem;
            color: #f87171;
            margin-bottom: 1rem;
            display: flex; align-items: center; gap: 8px;
        }

        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            font-size: .72rem;
            color: var(--gyo-muted);
            letter-spacing: .5px;
        }

        /* Subtle animated tea leaves */
        .tea-leaf {
            position: fixed;
            font-size: 1.2rem;
            opacity: .04;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
            user-select: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
    </style>
</head>
<body>
    <!-- Decorative background elements -->
    <div class="tea-leaf" style="top:10%;left:5%;animation-delay:0s;">🍵</div>
    <div class="tea-leaf" style="top:70%;left:3%;animation-delay:2s;">🌿</div>
    <div class="tea-leaf" style="top:20%;right:5%;animation-delay:4s;">🍃</div>
    <div class="tea-leaf" style="top:80%;right:8%;animation-delay:1s;">🌱</div>

    <div class="login-wrap">
        <div class="jp-header">
            <div class="logo-mark">
                <span class="jp-char">玉露</span>
            </div>
            <h1>Gyokuro</h1>
            <div class="jp-sub">INVESTMENT ADMIN PORTAL</div>
            <div class="jp-pattern"><span>管 理 シ ス テ ム</span></div>
        </div>

        <div class="login-card">
            {% if error %}
            <div class="error-box">
                <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
            </div>
            {% endif %}

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
            <div class="error-box" style="{% if cat == 'success' %}background:rgba(82,183,136,.1);border-color:rgba(82,183,136,.3);color:#74c69d;{% endif %}">
                {{ msg }}
            </div>
            {% endfor %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">ユーザー名 USERNAME</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" name="username"
                               required autofocus placeholder="admin">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">パスワード PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" name="password"
                               required placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="btn-signin">
                    <i class="bi bi-box-arrow-in-right me-2"></i>サインイン Sign In
                </button>
            </form>
        </div>

        <div class="footer-note">玉露 GYOKURO &nbsp;·&nbsp; INVESTMENT PLATFORM</div>
    </div>
</body>
</html>
